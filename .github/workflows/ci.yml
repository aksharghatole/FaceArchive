name: Development checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux libraries for the Qt offscreen platform
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - name: Check native Python imports
        run: python -c "import cv2, numpy, PIL; from PySide6 import QtWidgets"
      - name: Start Qt offscreen
        env:
          QT_DEBUG_PLUGINS: '1'
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt offscreen startup OK')"
      - run: python -m ruff check .
      - run: python -m pytest -q
        if: ${{ hashFiles('tests/**') != '' }}
