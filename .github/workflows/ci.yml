name: Development checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -c "import cv2, numpy, PIL; from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Dependency smoke test OK')"
      - run: python -m ruff check .
      - run: python -m pytest -q
        if: ${{ hashFiles('tests/**') != '' }}
